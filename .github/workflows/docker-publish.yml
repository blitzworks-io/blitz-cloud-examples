name: Build and publish images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [node-api, static-site, python-api]
    env:
      # Secrets can't be read in an `if`, so copy the check into a variable.
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Explain skipped push
        if: env.HAS_DOCKERHUB != 'true'
        run: echo "::notice::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not set, so the ${{ matrix.example }} image is built but not pushed."

      - name: Build, and push when logged in
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.example }}
          # blitz.cloud runs on amd64 machines only.
          platforms: linux/amd64
          push: ${{ env.HAS_DOCKERHUB == 'true' && github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'example' }}/blitz-example-${{ matrix.example }}:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'example' }}/blitz-example-${{ matrix.example }}:${{ github.sha }}
